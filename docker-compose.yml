services:
  volvo-dash:
    build: .
    container_name: volvo-dash
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session')"]
      interval: 60s
      timeout: 5s
      retries: 3
