[project]
name = "volvodash"
version = "0.1.0"
description = "Self-hosted trip and charging log for Volvo EVs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "aiomqtt>=2.3",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["volvodash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
